services:
  - type: web
    name: cineqo
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CINEQO_MODAL_URL
        sync: false
      - key: CINEQO_MODAL_API_KEY
        sync: false
      - key: CINEQO_CORS_ORIGINS
        value: "*"
      - key: CINEQO_WEB_RESULTS
        value: "8"
      - key: CINEQO_TMP_ROOT
        value: /tmp/cineqo
