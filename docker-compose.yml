services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      CINEQO_DIRECTOR_BASE_URL: ${CINEQO_DIRECTOR_BASE_URL:-http://director:8000/v1}
      CINEQO_DIRECTOR_MODEL: ${CINEQO_DIRECTOR_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      CINEQO_DIRECTOR_API_KEY: ${CINEQO_DIRECTOR_API_KEY:-local-open-model}
      CINEQO_WHISPER_URL: ${CINEQO_WHISPER_URL:-http://whisper:8011}
      CINEQO_WAN_URL: ${CINEQO_WAN_URL:-http://wan:8012}
      CINEQO_MUSETALK_URL: ${CINEQO_MUSETALK_URL:-http://musetalk:8013}
      CINEQO_IDENTITY_URL: ${CINEQO_IDENTITY_URL:-http://identity:8014}
      CINEQO_SHARED_ROOT: /shared
      CINEQO_CORS_ORIGINS: ${CINEQO_CORS_ORIGINS:-*}
      CINEQO_WEB_RESULTS: ${CINEQO_WEB_RESULTS:-8}
    volumes:
      - ./runtime/shared:/shared
    depends_on:
      - whisper
      - wan
      - musetalk
      - identity

  director:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: ["--model", "${CINEQO_DIRECTOR_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}", "--host", "0.0.0.0", "--port", "8000", "--gpu-memory-utilization", "0.35", "--limit-mm-per-prompt", "{\"image\":3}"]
    environment:
      HF_HOME: /models/hf
    volumes:
      - ./models/hf:/models/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper:
    build:
      context: .
      dockerfile: services/workers/whisper/Dockerfile
    profiles: ["gpu"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
    volumes:
      - ./models/whisper-cache:/root/.cache/whisper
      - ./runtime/shared:/shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  wan:
    build:
      context: .
      dockerfile: services/workers/wan/Dockerfile
    profiles: ["gpu"]
    environment:
      WAN_CKPT_DIR: ${WAN_CKPT_DIR:-/models/Wan2.2-TI2V-5B}
      WAN_TASK: ${WAN_TASK:-ti2v-5B}
      WAN_OUTPUT_DIR: /shared/wan
      WAN_JOB_TIMEOUT: ${WAN_JOB_TIMEOUT:-7200}
    volumes:
      - ./models/wan:/models
      - ./runtime/shared:/shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  musetalk:
    build:
      context: .
      dockerfile: services/workers/musetalk/Dockerfile
    profiles: ["gpu"]
    environment:
      MUSETALK_OUTPUT_DIR: /shared/musetalk
      MUSETALK_UNET: /models/musetalkV15/unet.pth
      MUSETALK_UNET_CONFIG: /models/musetalkV15/musetalk.json
    volumes:
      - ./models/musetalk:/models
      - ./runtime/shared:/shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  identity:
    build:
      context: .
      dockerfile: services/workers/identity/Dockerfile
    profiles: ["gpu"]
    environment:
      TRIPOSR_ROOT: /opt/triposr
      TRIPOSR_OUTPUT_DIR: /shared/identity
    volumes:
      - ./models/triposr-cache:/root/.cache/huggingface
      - ./runtime/shared:/shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
